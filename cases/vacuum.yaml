# Vacuum Reference Case Configuration
case_name: vacuum_reference
description: Baseline 30 keV proton beam propagation in vacuum without plasma cell or neutralizer gas.
method: vacuum

# Beam parameters
beam:
  species: proton
  energy_keV: 30.0
  current_mA: 10.0
  radius_m: 0.002
  rms_divergence: 0.0

# Gas & plasma cell parameters
plasma:
  gas: none
  pressure_torr: 0.0
  column_zmin_m: 0.0
  column_length_m: 0.20
  plasma_radius_m: 0.003
  neutralization: 0.0
  steady_state_neutralization: 0.0
  electron_temperature_eV: 1.0

# External fields
solenoid:
  Bz_T: 0.15

# Numerical & diagnostic parameters
# Production settings (task 94): 64x64x512 grid, electrostatic FFT solver (open boundaries).
# dt = 9.48e-12 s (electron gyration limit at 0.15 T). The beam front reaches the column end
# after ~9700 steps; 23000 steps = 2 domain transits (218 ns), used for every method.
# nppc_beam=4 -> beam macroparticle weight ~1150 (~5.9e6 beam macroparticles when filled).
# Ionization build-up (tau ~80 us for H2 at 1e-5 Torr) is far longer than any run here.
numerics:
  nx: 64
  ny: 64
  nz: 512
  xmax_m: 0.01
  ymax_m: 0.01
  zmin_m: -0.02
  zmax_m: 0.24
  max_steps: 23000
  checkpoint_period: 11500
  cfl: 0.5
  solver: es
  nppc_beam: 4
  nppc_plasma: 0
  diag_period: 2300
  reduced_diag_period: 50
  mcc: none
