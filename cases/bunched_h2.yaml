# RF-Bunched Beam H2 Plasma Neutralizer Case Configuration
case_name: bunched_H2_baseline
description: 30 keV RF-bunched 10 mA average proton beam (B_f=5) in 1e-5 Torr H2 plasma column.
method: seeded_compensation

# Beam parameters
beam:
  species: proton
  energy_keV: 30.0
  current_mA: 10.0
  radius_m: 0.002
  rms_divergence: 0.0
  bunching:
    rf_frequency_hz: 5.0e7
    phase_width_deg: 36.0
    bunching_factor: 5.0

# Gas & plasma cell parameters
plasma:
  gas: H2
  pressure_torr: 1.0e-5
  column_zmin_m: 0.0
  column_length_m: 0.20
  plasma_radius_m: 0.003
  steady_state_neutralization: 0.90
  electron_temperature_eV: 1.0

# External fields
solenoid:
  Bz_T: 0.15

# Numerical & diagnostic parameters
# Production settings: 64x64x512 grid, 20000 steps (2.7 beam transits),
# nppc=16 for low statistical noise, cfl=0.5 for temporal accuracy.
numerics:
  nx: 64
  ny: 64
  nz: 512
  xmax_m: 0.01
  ymax_m: 0.01
  zmin_m: -0.02
  zmax_m: 0.24
  max_steps: 20000
  checkpoint_period: 2000
  cfl: 0.5
  nppc_beam: 16
  nppc_plasma: 16
  diag_period: 100
  reduced_diag_period: 50
  mcc: electron_impact
