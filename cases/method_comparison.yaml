# Simulation Method Comparison Matrix Configuration

matrix_name: plasma_column_method_comparison
description: Systematic comparison matrix of neutralization simulation methods, gases, and pressures.

defaults:
  beam:
    energy_keV: 30.0
    current_mA: 10.0
    radius_m: 0.002
    rms_divergence: 0.0
  solenoid:
    Bz_T: 0.15
  # Production settings (task 94): 64x64x512 grid, electrostatic FFT solver (open boundaries).
  # dt = 9.48e-12 s (electron gyration limit at 0.15 T). The beam front reaches the column end
  # after ~9700 steps; 23000 steps = 2 domain transits (218 ns), used for every method.
  # nppc_beam=4 -> beam macroparticle weight ~1150 (~5.9e6 beam macroparticles when filled).
  # Ionization build-up (tau ~80 us for H2 at 1e-5 Torr) is far longer than any run here.
  numerics:
    nx: 64
    ny: 64
    nz: 512
    xmax_m: 0.01
    ymax_m: 0.01
    zmin_m: -0.02
    zmax_m: 0.24
    max_steps: 23000
    checkpoint_period: 11500
    cfl: 0.5
    solver: es
    nppc_beam: 4
    nppc_plasma: 16
    diag_period: 2300
    reduced_diag_period: 50

cases:
  - case_name: vacuum_reference
    method: vacuum
    method_category: baseline_reference
    physics_nature: Exact uncompensated vacuum beam propagation
    gas: none
    pressure_torr: 0.0
    numerics:
      nppc_plasma: 0
      mcc: none

  - case_name: seeded_H2_1e-6Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: H2
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: seeded_H2_1e-5Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_1e-6Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_1e-5Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: Kr
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: callback_H2_dynamic
    method: python_callback
    method_category: dynamic_source_approximation
    physics_nature: Dynamic pair injection via python callback
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: callback_Kr_dynamic
    method: python_callback
    method_category: dynamic_source_approximation
    physics_nature: Dynamic pair injection via python callback
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: cxx_H2_mcc_or_custom
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    physics_nature: C++ MCC Monte Carlo collision tracking
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: cxx_Kr_mcc_or_custom
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    physics_nature: C++ MCC Monte Carlo collision tracking
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50
