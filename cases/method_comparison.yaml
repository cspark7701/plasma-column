# Simulation Method Comparison Matrix Configuration

matrix_name: plasma_column_method_comparison
description: Systematic comparison matrix of neutralization simulation methods, gases, and pressures.

defaults:
  beam:
    energy_keV: 30.0
    current_mA: 10.0
    radius_m: 0.002
    rms_divergence: 0.0
  solenoid:
    Bz_T: 0.15
  # Production settings: 64x64x512 grid.
  # Seeded cases: 20000 steps (2.7 beam transits).
  # Callback/MCC cases: 120000 steps (16.2 beam transits) to accumulate ionization events.
  # nppc=16 throughout for low statistical noise. cfl=0.5 for temporal accuracy.
  numerics:
    nx: 64
    ny: 64
    nz: 512
    xmax_m: 0.01
    ymax_m: 0.01
    zmin_m: -0.02
    zmax_m: 0.24
    max_steps: 20000        # overridden per case for callback/MCC
    checkpoint_period: 2000 # overridden per case for callback/MCC
    cfl: 0.5
    nppc_beam: 16
    nppc_plasma: 16
    diag_period: 100
    reduced_diag_period: 50

cases:
  - case_name: vacuum_reference
    method: vacuum
    method_category: baseline_reference
    physics_nature: Exact uncompensated vacuum beam propagation
    gas: none
    pressure_torr: 0.0
    numerics:
      nppc_plasma: 0
      mcc: none

  - case_name: seeded_H2_1e-6Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: H2
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: seeded_H2_1e-5Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_1e-6Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_1e-5Torr
    method: seeded_compensation
    method_category: static_analytic_seeded
    physics_nature: Static analytical electron density estimate
    gas: Kr
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: callback_H2_dynamic
    method: python_callback
    method_category: dynamic_source_approximation
    physics_nature: Dynamic pair injection via python callback
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 120000     # 16.2 beam transits to accumulate ionization events
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: callback_Kr_dynamic
    method: python_callback
    method_category: dynamic_source_approximation
    physics_nature: Dynamic pair injection via python callback
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 120000     # 16.2 beam transits to accumulate ionization events
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: cxx_H2_mcc_or_custom
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    physics_nature: C++ MCC Monte Carlo collision tracking
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 120000     # 16.2 beam transits to accumulate ionization events
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: cxx_Kr_mcc_or_custom
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    physics_nature: C++ MCC Monte Carlo collision tracking
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 120000     # 16.2 beam transits to accumulate ionization events
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100
