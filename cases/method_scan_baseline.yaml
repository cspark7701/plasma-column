# Method comparison scan at baseline pressure
# Usage:
#   python scripts/run_scan.py --matrix cases/method_scan_baseline.yaml --dry_run

matrix_name: method_scan_baseline
description: >
  Method comparison (seeded / callback / cxx_mcc) at baseline gas pressures
  for H2 (1e-5 Torr) and Kr (1e-6 Torr).

defaults:
  beam:
    energy_keV: 30.0
    current_mA: 10.0
    radius_m: 0.002
    rms_divergence: 0.0
  solenoid:
    Bz_T: 0.15
  # Production settings (task 94): 64x64x512 grid, electrostatic FFT solver (open boundaries).
  # dt = 9.48e-12 s (electron gyration limit at 0.15 T). The beam front reaches the column end
  # after ~9700 steps; 23000 steps = 2 domain transits (218 ns), used for every method.
  # nppc_beam=4 -> beam macroparticle weight ~1150 (~5.9e6 beam macroparticles when filled).
  # Ionization build-up (tau ~80 us for H2 at 1e-5 Torr) is far longer than any run here.
  numerics:
    nx: 64
    ny: 64
    nz: 512
    xmax_m: 0.01
    ymax_m: 0.01
    zmin_m: -0.02
    zmax_m: 0.24
    max_steps: 23000
    checkpoint_period: 11500
    cfl: 0.5
    solver: es
    nppc_beam: 4
    nppc_plasma: 16
    diag_period: 2300
    reduced_diag_period: 50

cases:
  - case_name: seeded_H2_baseline
    method: seeded_compensation
    method_category: static_analytic_seeded
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_baseline
    method: seeded_compensation
    method_category: static_analytic_seeded
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: callback_H2_baseline
    method: python_callback
    method_category: dynamic_source_approximation
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: callback_Kr_baseline
    method: python_callback
    method_category: dynamic_source_approximation
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: cxx_mcc_H2_baseline
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50

  - case_name: cxx_mcc_Kr_baseline
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 23000
      checkpoint_period: 11500
      diag_period: 2300
      reduced_diag_period: 50
