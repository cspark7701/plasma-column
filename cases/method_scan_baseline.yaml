# Method comparison scan at baseline pressure
# Usage:
#   python scripts/run_scan.py --matrix cases/method_scan_baseline.yaml --dry_run

matrix_name: method_scan_baseline
description: >
  Method comparison (seeded / callback / cxx_mcc) at baseline gas pressures
  for H2 (1e-5 Torr) and Kr (1e-6 Torr).

defaults:
  beam:
    energy_keV: 30.0
    current_mA: 10.0
    radius_m: 0.002
    rms_divergence: 0.0
  solenoid:
    Bz_T: 0.15
  # Production settings: 64x64x512 grid.
  # Seeded cases: 20000 steps (2.7 beam transits).
  # Callback/MCC cases: 120000 steps (16.2 beam transits).
  # nppc=16 throughout. cfl=0.5 for temporal accuracy.
  numerics:
    nx: 64
    ny: 64
    nz: 512
    xmax_m: 0.01
    ymax_m: 0.01
    zmin_m: -0.02
    zmax_m: 0.24
    max_steps: 20000
    checkpoint_period: 2000
    cfl: 0.5
    nppc_beam: 16
    nppc_plasma: 16
    diag_period: 100
    reduced_diag_period: 50

cases:
  - case_name: seeded_H2_baseline
    method: seeded_compensation
    method_category: static_analytic_seeded
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      mcc: electron_impact

  - case_name: seeded_Kr_baseline
    method: seeded_compensation
    method_category: static_analytic_seeded
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      mcc: electron_impact

  - case_name: callback_H2_baseline
    method: python_callback
    method_category: dynamic_source_approximation
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 120000
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: callback_Kr_baseline
    method: python_callback
    method_category: dynamic_source_approximation
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 120000
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: cxx_mcc_H2_baseline
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    gas: H2
    pressure_torr: 1.0e-5
    numerics:
      max_steps: 120000
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100

  - case_name: cxx_mcc_Kr_baseline
    method: cxx_mcc_custom
    method_category: full_self_consistent_cxx_mcc
    gas: Kr
    pressure_torr: 1.0e-6
    numerics:
      max_steps: 120000
      checkpoint_period: 10000
      diag_period: 600
      reduced_diag_period: 100
