# Baseline H2 Plasma Neutralizer Case Configuration
case_name: seeded_H2_baseline
description: 30 keV 10 mA proton beam passing through a 20 cm H2 plasma column cell at 1e-5 Torr.
method: seeded_compensation

# Beam parameters
beam:
  species: proton
  energy_keV: 30.0
  current_mA: 10.0
  radius_m: 0.002
  rms_divergence: 0.0

# Gas & plasma cell parameters
plasma:
  gas: H2
  pressure_torr: 1.0e-5
  column_zmin_m: 0.0
  column_length_m: 0.20
  plasma_radius_m: 0.003
  neutralization: -1.0
  steady_state_neutralization: 0.90
  plasma_age_s: 2.0e-4
  electron_temperature_eV: 1.0

# External fields
solenoid:
  Bz_T: 0.15

# Numerical & diagnostic parameters
# Production settings (task 94): 64x64x512 grid, electrostatic FFT solver (open boundaries).
# dt = 9.48e-12 s (electron gyration limit at 0.15 T). The beam front reaches the column end
# after ~9700 steps; 23000 steps = 2 domain transits (218 ns), used for every method.
# nppc_beam=4 -> beam macroparticle weight ~1150 (~5.9e6 beam macroparticles when filled).
# Ionization build-up (tau ~80 us for H2 at 1e-5 Torr) is far longer than any run here.
numerics:
  nx: 64
  ny: 64
  nz: 512
  xmax_m: 0.01
  ymax_m: 0.01
  zmin_m: -0.02
  zmax_m: 0.24
  max_steps: 23000
  checkpoint_period: 11500
  cfl: 0.5
  solver: es
  nppc_beam: 4
  nppc_plasma: 16
  diag_period: 2300
  reduced_diag_period: 50
  mcc: electron_impact
